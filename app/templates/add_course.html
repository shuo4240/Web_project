{% extends "base.html" %}

{% block title %}新增課程{% endblock %}

{% block content %}
<section class="form-section" style="padding: 2rem;">
   <h1 class="heading">新增課程</h1>

   <form method="post" action="{{ url_for('add_course') }}" enctype="multipart/form-data"
         style="max-width: 1000px; margin: 4rem auto; display: flex; flex-direction: column; gap: 3.5rem; font-size: 2rem;">

      <div>
         <label for="title" style="font-weight: bold; font-size: 2rem;">課程名稱：</label><br>
         <input type="text" id="title" name="title" class="box"
                style="width: 100%; height: 4.5rem; font-size: 1.9rem; padding: 1.2rem;" required>
      </div>

      <div>
         <label for="description" style="font-weight: bold; font-size: 2rem;">課程簡介：</label><br>
         <textarea id="description" name="description" class="box" rows="8"
                   style="width: 100%; font-size: 1.9rem; padding: 1.2rem;" required></textarea>
      </div>

      <div>
         <label for="cover" style="font-weight: bold; font-size: 2rem;">封面圖片：</label><br>
         <input type="file" id="cover" name="cover" accept="image/*"
                style="font-size: 1.9rem; padding: 0.8rem;">
      </div>

      <div style="display: flex; justify-content: center;">
         <button type="submit" class="inline-btn"
                 style="font-size: 2rem; padding: 1.4rem 4rem;">送出</button>
      </div>

   </form>
</section>
{% endblock %}
