{% extends "base.html" %}

{% block title %}聯絡我們{% endblock %}

{% block content %}
<section class="contact">

   <div class="row">

      <div class="image">
         <img src="{{ url_for('static', filename='images/contact-img.webp') }}" alt="">
      </div>

      <form action="{{ url_for('contact') }}" method="post">
         <h3>聯絡我們</h3>
         <input type="text" placeholder="請輸入您的姓名" name="name" required maxlength="50" class="box">
         <input type="email" placeholder="請輸入您的信箱" name="email" required maxlength="50" class="box">
         <input type="number" placeholder="請輸入您的電話" name="number" required maxlength="50" class="box">
         <textarea name="msg" class="box" placeholder="請輸入您的訊息" required maxlength="1000" cols="30" rows="10"></textarea>
         <input type="submit" value="送出訊息" class="inline-btn" name="submit">
      </form>

   </div>

   <div class="box-container">

      <div class="box">
         <i class="fas fa-phone"></i>
         <h3>電話</h3>
         <a href="tel:1234567890">1234567890</a>
         <a href="tel:1112223333">1112223333</a>
      </div>

      <div class="box">
         <i class="fas fa-envelope"></i>
         <h3>Email</h3>
         <a href="mailto:shaikhanas@gmail.com">12345@gmail.com</a>
         <a href="mailto:anasbhai@gmail.com">12345678@gmail.com</a>
      </div>

      <div class="box">
         <i class="fas fa-map-marker-alt"></i>
         <h3>地址</h3>
         <a href="#">台南市東區大學路1號 成功大學</a>
      </div>

   </div>

</section>
{% endblock %}
